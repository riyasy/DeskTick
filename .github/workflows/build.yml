name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: x64
            arch: x64
            out_dir: x64/Release/
          - runner: windows-11-arm
            platform: ARM64
            arch: ARM64
            out_dir: ARM64/Release/
          - runner: windows-latest
            platform: Win32
            arch: x86
            out_dir: Win32/Release/

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # v143 overrides the project's v145: the runners ship VS 2022, not VS 18.
      - name: Build DeskTick
        run: |
          msbuild src\DeskTick\DeskTick.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143

      # lang\ ships beside the exe or the build is English-only. Staged into one
      # folder because upload-artifact roots the zip at the common ancestor of
      # everything it matches: listing the exe and lang\ directly gives a zip
      # with the exe still buried under x64\Release\ and lang\ at the top.
      # version.h is the one place the version lives; the artifact name reads it
      # rather than carrying a second copy to forget to bump.
      #
      # LICENSE comes from the repo root: GPLv3 section 4 asks that a copy travel
      # with the program, so the download carries the same terms the MSIX does.
      - name: Stage artifact
        id: stage
        run: |
          mkdir stage
          copy src\DeskTick\${{ matrix.out_dir }}DeskTick.exe stage\
          copy LICENSE stage\
          xcopy /Y /I /Q src\DeskTick\lang\* stage\lang\
          $v = (Select-String src\DeskTick\version.h -Pattern '#define VER_DISPLAY\s+"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      # GitHub always zips, so this name is the .zip's base name.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskTick_${{ steps.stage.outputs.version }}_${{ matrix.arch }}
          path: stage/
