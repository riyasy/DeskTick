name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: x64
            arch: x64
            out_dir: x64/Release/
          - runner: windows-11-arm
            platform: ARM64
            arch: ARM64
            out_dir: ARM64/Release/
          - runner: windows-latest
            platform: Win32
            arch: x86
            out_dir: Win32/Release/

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # v143 overrides the project's v145: the runners ship VS 2022, not VS 18.
      - name: Build DeskTick
        run: |
          msbuild src\DeskTick\DeskTick.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143

      # lang\ ships beside the exe or the build is English-only; FindNearExe
      # walks up, so the artifact's layout only has to keep them siblings.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskTick-${{ matrix.arch }}
          path: |
            src/DeskTick/${{ matrix.out_dir }}DeskTick.exe
            src/DeskTick/lang/
